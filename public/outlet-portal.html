<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJB Outlet &amp; Line Requisition Portal | Jang-Jang Bakeshop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-[#FAF6EE] text-[#2A1B2E] min-h-screen flex flex-col">
  <!-- Top Corporate Bar -->
  <header class="bg-[#3D1C52] text-white p-4 shadow-md border-b border-[#C8963E]/40">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-white p-1 border border-[#C8963E] flex items-center justify-center">
          <img src="https://raw.githubusercontent.com/zzp-systems/jjb-systems/refs/heads/main/jjb-logo-transaparent.png" alt="Logo" class="w-full h-full object-contain">
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">JJB Outlet Requisition Portal</h1>
          <p class="text-xs text-[#E5C585]">Pan de Verde &amp; Laurice Delicacies Order Terminal</p>
        </div>
      </div>
      <a href="/" class="text-xs bg-[#C8963E] hover:bg-[#b58330] text-[#240e32] font-bold px-3 py-1.5 rounded transition">
        ← Open Bodega WMS
      </a>
    </div>
  </header>

  <main class="flex-1 max-w-4xl mx-auto w-full p-4 md:p-6 space-y-6">
    <div class="bg-white p-6 rounded-2xl border border-[#E2D1B8] shadow-sm space-y-4">
      <div class="border-b pb-3">
        <span class="text-[11px] font-mono font-bold bg-[#5B2E7A] text-white px-2 py-0.5 rounded">Form-ORD-001</span>
        <h2 class="text-xl font-bold text-[#3D1C52] mt-1">Submit Daily Outlet Recipe Batch Order</h2>
        <p class="text-xs text-gray-500">Orders submitted here are instantly routed to Romeo Malusay's scaling workbench queue.</p>
      </div>

      <form id="orderForm" class="space-y-4 text-xs">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block font-bold text-gray-700 mb-1">Target Outlet / Facility</label>
            <select id="outletSelect" class="w-full p-2.5 border rounded-lg bg-white font-medium">
              <option value="pan-de-verde">Pan de Verde Outlet (Communal)</option>
              <option value="laurice-delicacies">Laurice Delicacies Outlet (Bankerohan)</option>
              <option value="indangan-biscocho">Indangan - Biscocho Commercial Hall</option>
              <option value="indangan-otap">Indangan - Otap Laminated Hall</option>
            </select>
          </div>

          <div>
            <label class="block font-bold text-gray-700 mb-1">Product Recipe Formulation</label>
            <select id="recipeSelect" class="w-full p-2.5 border rounded-lg bg-white font-medium">
              <option value="BRD-PAN-3KG">BRD-PAN-3KG: Classic Davao Pandesal (3-Kilo Scaled Kit - 85 pcs)</option>
              <option value="BRD-PAN-6KG">BRD-PAN-6KG: Classic Davao Pandesal (6-Kilo Scaled Kit - 170 pcs)</option>
              <option value="BRD-PAN-001">BRD-PAN-001: Classic Davao Pandesal (Half-Sack 12.5kg - 450 pcs)</option>
              <option value="BRD-UBE-001">BRD-UBE-001: Special Ube Cheese Pandesal (300 pcs)</option>
              <option value="PST-ENS-001">PST-ENS-001: Special Butter Ensaymada (200 pcs)</option>
              <option value="BRD-MON-001">BRD-MON-001: Classic Monay &amp; Sweet Loaf (250 pcs)</option>
              <option value="BIS-001">BIS-001: Biscocho Toasted Bread Delicacy (1,000 pcs)</option>
              <option value="OTP-001">OTP-001: Otap Layered Puff Pastry (1,200 pcs)</option>
            </select>
          </div>

          <div>
            <label class="block font-bold text-gray-700 mb-1">Batch Multiplier</label>
            <input type="number" id="multiplierInput" value="1.0" min="0.5" step="0.5" class="w-full p-2.5 border rounded-lg font-mono font-bold text-[#5B2E7A]">
          </div>

          <div>
            <label class="block font-bold text-gray-700 mb-1">Needed Delivery Date</label>
            <input type="date" id="dateInput" class="w-full p-2.5 border rounded-lg font-bold">
          </div>
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">Ordering Personnel / Branch Baker</label>
          <input type="text" id="personInput" placeholder="e.g. Feliciano Gomera / Jhoanna Tejano" class="w-full p-2.5 border rounded-lg">
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">Special Preparation Instructions</label>
          <textarea id="notesInput" rows="2" placeholder="e.g. Priority for 06:00 AM delivery. Check ice substitution." class="w-full p-2.5 border rounded-lg"></textarea>
        </div>

        <div class="pt-2 flex justify-end">
          <button type="submit" class="bg-[#5B2E7A] hover:bg-[#3D1C52] text-white font-bold text-xs px-6 py-3 rounded-lg shadow-md transition flex items-center gap-2">
            ✓ Dispatch Requisition to Romeo Malusay's Bodega Queue
          </button>
        </div>
      </form>
    </div>

    <!-- Confirmation Toast -->
    <div id="confirmBox" class="hidden bg-green-100 border border-green-300 text-green-900 p-4 rounded-xl text-xs space-y-1">
      <p class="font-bold text-sm">Order Dispatched to Romeo's Queue!</p>
      <p id="confirmDetails"></p>
    </div>
  </main>

  <script>
    document.getElementById('dateInput').value = new Date().toISOString().slice(0, 10);

    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const outlet = document.getElementById('outletSelect').value;
      const recipe = document.getElementById('recipeSelect').value;
      const multiplier = parseFloat(document.getElementById('multiplierInput').value) || 1.0;
      const person = document.getElementById('personInput').value || 'Authorized Outlet Baker';
      
      const orderId = 'BORD-' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '-' + Math.floor(100 + Math.random() * 900);
      
      // Save directly to localStorage so the main app picks it up
      try {
        const storageKey = 'JJB_WMS_LIVE_V4_6_STATE_batch_orders';
        const existing = JSON.parse(localStorage.getItem(storageKey) || '[]');
        const newOrder = {
          orderId: orderId,
          requestDate: new Date().toISOString().slice(0, 10),
          targetDate: document.getElementById('dateInput').value,
          outletId: outlet,
          outletName: document.getElementById('outletSelect').selectedOptions[0].text,
          recipeSku: recipe,
          recipeName: document.getElementById('recipeSelect').selectedOptions[0].text.split(':')[1]?.trim() || recipe,
          batchMultiplier: multiplier,
          requestedQtyPcs: Math.round(100 * multiplier),
          requestedBy: person,
          enteredBy: 'Outlet Portal (' + person + ')',
          status: 'PENDING_BATCHING',
          bulkRequestStatus: 'NOT_REQUESTED',
          notes: document.getElementById('notesInput').value || 'Direct order from branch terminal'
        };
        existing.unshift(newOrder);
        localStorage.setItem(storageKey, JSON.stringify(existing));
      } catch (err) {
        console.error(err);
      }

      const box = document.getElementById('confirmBox');
      document.getElementById('confirmDetails').innerText = 'Order ID: ' + orderId + ' (' + recipe + ') is now awaiting Romeo Malusay to request bulk raw materials and precision scale.';
      box.classList.remove('hidden');
    });
  </script>
</body>
</html>
