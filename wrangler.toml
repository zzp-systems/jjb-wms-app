# ──────────────────────────────────────────────
# JJB WMS — Cloudflare Pages Configuration
# Jang-Jang Bakeshop ERP — Warehouse Management Module
# ──────────────────────────────────────────────
#
# NOTE: This file is provided for reference. If your existing
# jjb-wms-app project already has a wrangler.toml, update the
# bindings below to match — do NOT replace your entire file.
# Only add/verify the D1, R2, and secrets sections.
# ──────────────────────────────────────────────

name = "jjb-wms-app"
compatibility_date = "2026-11-15"
pages_build_output_dir = "dist"

# ── D1 Database Binding ──
[[d1_databases]]
binding = "DB"
database_name = "jjb-wms-db"
database_id = "f6064ec6-8e1a-4cbd-ac35-17c18795d3a3"

# ── R2 Bucket Binding (shared with CRM + ARAP) ──
# Use path prefix: wms/ for WMS files (photos, attachments)
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "jjb-erp-assets"

# ── Secrets (set via CLI, NOT in this file) ──
# wrangler pages secret put JWT_SECRET     (shared with CRM + ARAP for SSO)
# wrangler pages secret put SYNC_API_KEY    (shared secret for CRM↔WMS↔ARAP sync auth)
# wrangler pages secret put ARAP_API_URL    (base URL of z-books-systems for AP/delivery sync)
# wrangler pages secret put CRM_API_URL     (base URL of jjb-crm-app for order status webhooks)
